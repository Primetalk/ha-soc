i2c:
  id: battery_i2c
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: ${i2c_frequency}
  scan: true

globals:
  - id: last_measurement_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_voltage_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Live double precision avoids losing small increments as lifetime totals grow.
  - id: energy_charged_live
    type: double
    restore_value: false
    initial_value: "0.0"
  - id: energy_discharged_live
    type: double
    restore_value: false
    initial_value: "0.0"
  - id: energy_previous_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: energy_has_baseline
    type: bool
    restore_value: false
    initial_value: "false"
  - id: energy_checkpoint
    type: uint32_t[6]
    restore_value: true
    # ESP8266 preferences are positional. Allocate after existing globals,
    # numbers (800) and Wi-Fi (250), but before our restore callback (-100).
    # Moving this earlier breaks upgrade and rollback of legacy state.
    setup_priority: -50
    initial_value: "{0, 0, 0, 0, 0, 0}"
    update_interval: ${restored_state_poll_interval}

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            static_assert(sizeof(id(energy_checkpoint)) / sizeof(uint32_t) ==
                          battery_monitor::ENERGY_CHECKPOINT_WORDS,
                          "Energy checkpoint size does not match its schema");
            battery_monitor::restore_energy_checkpoint(id(energy_checkpoint),
                id(energy_charged_live), id(energy_discharged_live));
            id(energy_has_baseline) = false;
        - script.execute: publish_energy_totals
  on_shutdown:
    # Shutdown reverses setup order: stage before checkpoint's -50 save,
    # followed by the preferences component's final flash synchronization.
    - priority: -100
      then:
        - script.execute: checkpoint_energy_totals

script:
  - id: publish_energy_totals
    then:
      - lambda: |-
          id(battery_energy_charged).publish_state(id(energy_charged_live));
          id(battery_energy_discharged).publish_state(id(energy_discharged_live));
  - id: checkpoint_energy_totals
    then:
      - lambda: |-
          battery_monitor::store_energy_checkpoint(id(energy_checkpoint),
              id(energy_charged_live), id(energy_discharged_live));

sensor:
  - platform: template
    name: Battery Energy Charged
    id: battery_energy_charged
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    name: Battery Energy Discharged
    id: battery_energy_discharged
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    accuracy_decimals: 6
    update_interval: never

  - platform: ina219
    id: ina219_monitor
    i2c_id: battery_i2c
    address: ${ina219_address}
    shunt_resistance: ${shunt_resistance}
    max_current: ${shunt_max_current}
    max_voltage: ${ina219_max_bus_voltage}
    update_interval: ${measurement_update_interval}

    bus_voltage:
      name: Battery Voltage
      id: battery_voltage
      accuracy_decimals: 3
      filters:
        - lambda: |-
            if (!std::isfinite(x)) {
              id(last_voltage_ms) = 0;
              id(reset_charge_detection).execute();
              return {};
            }
            return x;
      on_value:
        - lambda: id(last_voltage_ms) = millis();

    shunt_voltage:
      name: INA219 Shunt Voltage
      id: ina219_shunt_voltage_raw
      accuracy_decimals: 6
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            if (!std::isfinite(x)) return {};
            return x;

    current:
      name: INA219 Raw Current
      id: ina219_current_raw
      accuracy_decimals: 3
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            if (!std::isfinite(x)) {
              id(reset_charge_detection).execute();
              return {};
            }
            return x;
      on_value:
        then:
          - lambda: id(last_measurement_ms) = millis();
          - sensor.template.publish:
              id: battery_current
              state: !lambda return x * ${current_polarity_multiplier};
          - lambda: |-
              if (!id(battery_voltage).has_state() ||
                  !std::isfinite(id(battery_voltage).state)) {
                battery_monitor::invalidate_sensor_state(id(battery_power));
                id(energy_has_baseline) = false;
              } else {
                id(battery_power).publish_state(
                    id(battery_voltage).state * x * ${current_polarity_multiplier});
              }
          - binary_sensor.template.publish:
              id: battery_charging
              state: !lambda return x * ${current_polarity_multiplier} > ${current_state_deadband_amps};
          - binary_sensor.template.publish:
              id: battery_discharging
              state: !lambda return x * ${current_polarity_multiplier} < -${current_state_deadband_amps};
          - binary_sensor.template.publish:
              id: battery_idle
              state: !lambda |-
                return std::abs(x * ${current_polarity_multiplier}) <=
                       ${current_state_deadband_amps};
          - script.execute:
              id: integrate_soc_sample
              current_a: !lambda return x * ${current_polarity_multiplier};
          - script.execute: evaluate_charge_detection

    power:
      name: INA219 Raw Power
      id: ina219_power_raw
      accuracy_decimals: 2
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            if (!std::isfinite(x)) return {};
            return x;

  - platform: template
    name: Battery Current
    id: battery_current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    name: Battery Power
    id: battery_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    on_value:
      then:
        - lambda: |-
            battery_monitor::integrate_energy_sample(x, millis(),
                ${measurement_stale_after_ms}, id(energy_charged_live),
                id(energy_discharged_live), id(energy_previous_ms),
                id(energy_has_baseline));

  - platform: template
    name: Shunt Voltage
    id: shunt_voltage_mv
    unit_of_measurement: mV
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      if (!id(ina219_shunt_voltage_raw).has_state() ||
          !std::isfinite(id(ina219_shunt_voltage_raw).state)) {
        return {};
      }
      return id(ina219_shunt_voltage_raw).state * 1000.0f;

binary_sensor:
  - platform: template
    name: Battery Charging
    id: battery_charging
    device_class: battery_charging
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

  - platform: template
    name: Battery Discharging
    id: battery_discharging
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

  - platform: template
    name: Battery Idle
    id: battery_idle
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

  - platform: template
    name: Measurement Healthy
    id: measurement_healthy
    entity_category: diagnostic
    lambda: |-
      if (id(last_measurement_ms) == 0 ||
          (uint32_t) (millis() - id(last_measurement_ms)) > ${measurement_stale_after_ms}) {
        return false;
      }
      return id(battery_voltage).has_state() &&
             id(battery_current).has_state() &&
             std::isfinite(id(battery_voltage).state) &&
             std::isfinite(id(battery_current).state);

interval:
  # Share SOC's board-specific checkpoint cadence (60s / 15min on ESP8266).
  - interval: ${soc_checkpoint_interval}
    then:
      - script.execute: checkpoint_energy_totals
  - interval: 10s
    then:
      - script.execute: publish_energy_totals
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(last_measurement_ms) != 0 &&
                     (uint32_t) (millis() - id(last_measurement_ms)) >
                         ${measurement_stale_after_ms} &&
                     (id(battery_current).has_state() || id(battery_voltage).has_state());
          then:
            # Do not leave stale values looking current in Home Assistant.
            - lambda: |-
                battery_monitor::invalidate_sensor_state(id(battery_voltage));
                battery_monitor::invalidate_sensor_state(id(battery_current));
                battery_monitor::invalidate_sensor_state(id(battery_power));
                id(energy_has_baseline) = false;
                battery_monitor::invalidate_sensor_state(id(ina219_current_raw));
                battery_monitor::invalidate_sensor_state(id(ina219_power_raw));
                battery_monitor::invalidate_sensor_state(id(ina219_shunt_voltage_raw));
                battery_monitor::invalidate_sensor_state(id(shunt_voltage_mv));
                id(battery_charging).invalidate_state();
                id(battery_discharging).invalidate_state();
                id(battery_idle).invalidate_state();
                ESP_LOGW("measurement", "INA219 measurements became stale");
            - script.execute: evaluate_soc_rules
