i2c:
  id: battery_i2c
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: ${i2c_frequency}
  scan: true

# Reuse ESPHome's INA219 driver through a small optional-presence adapter.
external_components:
  - source:
      type: local
      path: components
    components: [optional_ina219]

globals:
  - id: last_main_current_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_auxiliary_current_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_measurement_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_voltage_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Live double precision avoids losing small increments as lifetime totals grow.
  - id: energy_charged_live
    type: double
    restore_value: false
    initial_value: "0.0"
  - id: energy_discharged_live
    type: double
    restore_value: false
    initial_value: "0.0"
  - id: energy_previous_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: energy_has_baseline
    type: bool
    restore_value: false
    initial_value: "false"
  - id: energy_checkpoint
    type: uint32_t[6]
    restore_value: true
    # ESP8266 preferences are positional. Allocate after existing globals,
    # numbers (800) and Wi-Fi (250), but before our restore callback (-100).
    # Moving this earlier breaks upgrade and rollback of legacy state.
    setup_priority: -50
    initial_value: "{0, 0, 0, 0, 0, 0}"
    update_interval: ${restored_state_poll_interval}

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            static_assert(sizeof(id(energy_checkpoint)) / sizeof(uint32_t) ==
                          battery_monitor::ENERGY_CHECKPOINT_WORDS,
                          "Energy checkpoint size does not match its schema");
            battery_monitor::restore_energy_checkpoint(id(energy_checkpoint),
                id(energy_charged_live), id(energy_discharged_live));
            id(energy_has_baseline) = false;
        - script.execute: publish_energy_totals
  on_shutdown:
    # Shutdown reverses setup order: stage before checkpoint's -50 save,
    # followed by the preferences component's final flash synchronization.
    - priority: -100
      then:
        - script.execute: checkpoint_energy_totals

script:
  - id: invalidate_combined_measurement
    mode: restart
    then:
      - lambda: |-
          battery_monitor::invalidate_sensor_state(id(battery_current));
          battery_monitor::invalidate_sensor_state(id(battery_power));
          id(last_measurement_ms) = 0;
          id(last_integration_ms) = 0;
          id(energy_has_baseline) = false;
          id(reset_charge_detection).execute();
          battery_monitor::current_direction_detector().reset();
          id(battery_charging).invalidate_state();
          id(battery_discharging).invalidate_state();
          id(battery_idle).invalidate_state();
      - script.execute: evaluate_soc_rules

  - id: process_battery_measurement
    mode: restart
    parameters:
      main_current_a: float
    then:
      - lambda: |-
          const uint32_t now = millis();
          const float current = battery_monitor::parallel_branch_current(
              main_current_a, id(ina219_aux_monitor).is_present(),
              id(auxiliary_current).state,
              battery_monitor::sample_is_fresh(
                  now, id(last_auxiliary_current_ms), ${measurement_stale_after_ms}));
          if (!std::isfinite(current)) {
            id(invalidate_combined_measurement).execute();
            return;
          }
          id(last_measurement_ms) = now;
          id(battery_current).publish_state(current);
          if (!id(battery_voltage).has_state() ||
              !std::isfinite(id(battery_voltage).state) ||
              !battery_monitor::sample_is_fresh(
                  now, id(last_voltage_ms), ${measurement_stale_after_ms})) {
            battery_monitor::invalidate_sensor_state(id(battery_power));
            id(energy_has_baseline) = false;
          } else {
            id(battery_power).publish_state(id(battery_voltage).state * current);
          }
          auto &direction = battery_monitor::current_direction_detector();
          if (direction.update(now, current,
              ${current_state_enter_amps}, ${current_state_exit_amps},
              ${current_state_settle_ms}, ${measurement_stale_after_ms})) {
            const auto state = direction.state();
            id(battery_charging).publish_state(state == battery_monitor::CurrentDirection::Charging);
            id(battery_discharging).publish_state(state == battery_monitor::CurrentDirection::Discharging);
            id(battery_idle).publish_state(state == battery_monitor::CurrentDirection::Idle);
          } else {
            id(battery_charging).invalidate_state();
            id(battery_discharging).invalidate_state();
            id(battery_idle).invalidate_state();
          }
          id(integrate_soc_sample).execute(current);
          id(evaluate_charge_detection).execute();

  - id: publish_energy_totals
    then:
      - lambda: |-
          id(battery_energy_charged).publish_state(id(energy_charged_live));
          id(battery_energy_discharged).publish_state(id(energy_discharged_live));
  - id: checkpoint_energy_totals
    then:
      - lambda: |-
          battery_monitor::store_energy_checkpoint(id(energy_checkpoint),
              id(energy_charged_live), id(energy_discharged_live));

sensor:
  # Always configured: absence at boot selects the original single-shunt layout.
  - platform: optional_ina219
    id: ina219_aux_monitor
    i2c_id: battery_i2c
    address: ${aux_ina219_address}
    shunt_resistance: ${aux_shunt_resistance}
    max_current: ${aux_max_current}
    max_voltage: ${ina219_max_bus_voltage}
    update_interval: ${measurement_update_interval}
    current:
      name: Auxiliary Current
      id: auxiliary_current
      accuracy_decimals: 4
      filters:
        - lambda: |-
            if (!std::isfinite(x)) {
              id(last_auxiliary_current_ms) = 0;
              battery_monitor::invalidate_sensor_state(id(auxiliary_current));
              id(invalidate_combined_measurement).execute();
              return {};
            }
            return x * ${aux_current_polarity_multiplier};
      on_value:
        - lambda: id(last_auxiliary_current_ms) = millis();

  - platform: template
    name: Battery Energy Charged
    id: battery_energy_charged
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    name: Battery Energy Discharged
    id: battery_energy_discharged
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    accuracy_decimals: 6
    update_interval: never

  - platform: ina219
    id: ina219_monitor
    i2c_id: battery_i2c
    address: ${ina219_address}
    shunt_resistance: ${shunt_resistance}
    max_current: ${shunt_max_current}
    max_voltage: ${ina219_max_bus_voltage}
    update_interval: ${measurement_update_interval}

    bus_voltage:
      name: Battery Voltage
      id: battery_voltage
      accuracy_decimals: 3
      filters:
        - lambda: |-
            if (!std::isfinite(x)) {
              id(last_voltage_ms) = 0;
              id(reset_charge_detection).execute();
              return {};
            }
            return x;
      on_value:
        - lambda: id(last_voltage_ms) = millis();

    shunt_voltage:
      name: INA219 Shunt Voltage
      id: ina219_shunt_voltage_raw
      accuracy_decimals: 6
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            if (!std::isfinite(x)) return {};
            return x;

    current:
      name: INA219 Raw Current
      id: ina219_current_raw
      accuracy_decimals: 3
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            if (!std::isfinite(x)) {
              id(last_main_current_ms) = 0;
              id(invalidate_combined_measurement).execute();
              return {};
            }
            return x;
      on_value:
        - lambda: |-
            id(last_main_current_ms) = millis();
            id(process_battery_measurement).execute(x * ${current_polarity_multiplier});

    power:
      name: INA219 Raw Power
      id: ina219_power_raw
      accuracy_decimals: 2
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - lambda: |-
            if (!std::isfinite(x)) return {};
            return x;

  - platform: template
    name: Battery Current
    id: battery_current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    name: Battery Power
    id: battery_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    on_value:
      then:
        - lambda: |-
            battery_monitor::integrate_energy_sample(x, millis(),
                ${measurement_stale_after_ms}, id(energy_charged_live),
                id(energy_discharged_live), id(energy_previous_ms),
                id(energy_has_baseline));

  - platform: template
    name: Shunt Voltage
    id: shunt_voltage_mv
    unit_of_measurement: mV
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      if (!id(ina219_shunt_voltage_raw).has_state() ||
          !std::isfinite(id(ina219_shunt_voltage_raw).state)) {
        return {};
      }
      return id(ina219_shunt_voltage_raw).state * 1000.0f;

binary_sensor:
  - platform: template
    name: Auxiliary INA219 Present
    id: auxiliary_ina219_present
    entity_category: diagnostic
    lambda: return id(ina219_aux_monitor).is_present();

  - platform: template
    name: Auxiliary Measurement Healthy
    id: auxiliary_measurement_healthy
    entity_category: diagnostic
    lambda: |-
      return id(ina219_aux_monitor).is_present() &&
             battery_monitor::sample_is_fresh(
                 millis(), id(last_auxiliary_current_ms), ${measurement_stale_after_ms}) &&
             id(auxiliary_current).has_state() && std::isfinite(id(auxiliary_current).state);

  - platform: template
    name: Battery Charging
    id: battery_charging
    device_class: battery_charging

  - platform: template
    name: Battery Discharging
    id: battery_discharging

  - platform: template
    name: Battery Idle
    id: battery_idle

  - platform: template
    name: Measurement Healthy
    id: measurement_healthy
    entity_category: diagnostic
    lambda: |-
      if (!battery_monitor::sample_is_fresh(
              millis(), id(last_measurement_ms), ${measurement_stale_after_ms})) {
        return false;
      }
      return id(battery_voltage).has_state() &&
             id(battery_current).has_state() &&
             std::isfinite(id(battery_voltage).state) &&
             std::isfinite(id(battery_current).state);

interval:
  # Share SOC's board-specific checkpoint cadence (60s / 15min on ESP8266).
  - interval: ${soc_checkpoint_interval}
    then:
      - script.execute: checkpoint_energy_totals
  - interval: 10s
    then:
      - script.execute: publish_energy_totals
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool main_stale = id(last_main_current_ms) != 0 &&
              !battery_monitor::sample_is_fresh(
                  now, id(last_main_current_ms), ${measurement_stale_after_ms});
          const bool auxiliary_stale = id(ina219_aux_monitor).is_present() &&
              !battery_monitor::sample_is_fresh(
                  now, id(last_auxiliary_current_ms), ${measurement_stale_after_ms});
          if (main_stale) {
            battery_monitor::invalidate_sensor_state(id(battery_voltage));
            id(last_voltage_ms) = 0;
            battery_monitor::invalidate_sensor_state(id(ina219_current_raw));
            battery_monitor::invalidate_sensor_state(id(ina219_power_raw));
            battery_monitor::invalidate_sensor_state(id(ina219_shunt_voltage_raw));
            battery_monitor::invalidate_sensor_state(id(shunt_voltage_mv));
          }
          if (auxiliary_stale)
            battery_monitor::invalidate_sensor_state(id(auxiliary_current));
          if ((main_stale || auxiliary_stale) && id(battery_current).has_state()) {
            ESP_LOGW("measurement", "Required branch current became unavailable");
            id(invalidate_combined_measurement).execute();
          }
