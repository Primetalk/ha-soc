# Alternative ESP8266 entry point. Read docs/esp8266-migration.md before use.
# Shares measurement, SOC, rules, display, and connectivity with the ESP32-C3.
# Hardware operation and power-loss recovery require commissioning on your board.

substitutions:
  device_name: battery-monitor-esp8266
  friendly_name: Battery Monitor ESP8266
  esp8266_board: d1_mini
  i2c_sda_pin: GPIO4
  i2c_scl_pin: GPIO5
  # Reduce flash-sector erases; sudden power loss can lose about 15 minutes of
  # integrated SOC plus the persistence poll and flash coalescing delay.
  soc_checkpoint_interval: 15min
  flash_write_interval: 60s

packages:
  battery_config: !include packages/battery-config.yaml
  connectivity: !include packages/connectivity.yaml
  measurement: !include packages/measurement.yaml
  soc: !include packages/soc.yaml
  soc_rules: !include packages/soc-rules.yaml
  display: !include packages/display.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  includes:
    - include/battery_monitor_types.h
  project:
    name: primetalk.esphome-shunt
    version: 0.3.0

esp8266:
  board: ${esp8266_board}
  restore_from_flash: true

preferences:
  flash_write_interval: ${flash_write_interval}

# Allow Home Assistant and one logging client with fewer allocated API slots.
# Encryption, reconnect replay, and offline behavior come from connectivity.yaml.
api:
  max_connections: 2
