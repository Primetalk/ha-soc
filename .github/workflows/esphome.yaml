name: ESPHome

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - battery-monitor.yaml
          - battery-monitor-esp8266.yaml
    env:
      ESPHOME_CONFIGURATION: ${{ matrix.configuration }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install supported ESPHome
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install "esphome==2026.8.0"

      - name: Validate repository invariants
        run: python tests/validate_repository.py

      - name: Compile and run deterministic helper tests
        shell: bash
        run: |
          set -euo pipefail
          binary="$(mktemp)"
          trap 'rm -f "$binary"' EXIT
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/battery_monitor_helpers_test.cpp -o "$binary"
          "$binary"

      - name: Create non-secret ESPHome fixture
        run: cp -- secrets.example.yaml secrets.yaml

      - name: Validate ESPHome configuration
        run: esphome config "$ESPHOME_CONFIGURATION"

      - name: Compile ESPHome firmware
        shell: bash
        run: |
          set -euo pipefail
          esphome compile "$ESPHOME_CONFIGURATION" 2>&1 | tee /tmp/esphome-compile.log
          if grep -E '(^|[[:space:]])warning:' /tmp/esphome-compile.log; then
            echo "Compiler warning detected in $ESPHOME_CONFIGURATION build" >&2
            exit 1
          fi
